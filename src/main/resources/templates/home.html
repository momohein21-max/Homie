<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homie - Home</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>
<!-- Simple top navigation bar. -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Homie</span>
    <form th:action="@{/logout}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
    </form>
</nav>

<div class="container mt-5">
    <div class="p-5 bg-light rounded text-center">
        <h1>Welcome to Homie</h1>
        <p class="lead">Your shared house dashboard will live here.</p>
        <p class="text-muted">
            Sprint 1 sets up accounts and login. Next sprints add the cleaning
            schedule, washing and bins schedule, bills, and announcements.
        </p>
    </div>
</div>
</body>
</html>
