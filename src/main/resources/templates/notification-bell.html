<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  The notification bell shown in the topbar of every logged-in page.

  Included in each page with:
    <div th:replace="~{fragments/notification-bell :: notificationBell}"></div>

  The unread badge count comes from the "unreadNotificationCount" model
  attribute, added to every request automatically by
  config/GlobalModelAttributes - so no controller has to remember to pass
  it in themselves. Clicking the bell fetches the actual list from
  /api/notifications (see NotificationController) and renders it client
  side; clicking a notification marks it read and follows its link (e.g.
  to the Bills page for a due-date reminder).

  The CSRF token/header are read from data attributes on the wrapper (set
  from Spring Security's request-scoped "_csrf" object, always available
  regardless of which controller rendered the parent page) rather than a
  page-wide <meta> tag, so this fragment works when dropped into any
  template without also having to edit that template's <head>.
-->
<div th:fragment="notificationBell" class="notif-bell-wrap"
     th:attr="data-csrf-token=${_csrf.token},data-csrf-header=${_csrf.headerName}">

    <style>
        /*
          Every var() below has a fallback (the second value) so this
          fragment renders correctly even on pages whose own <style>
          block doesn't happen to define every one of these custom
          properties - the fallbacks match the values used across the
          rest of the app's pages exactly.
        */
        .notif-bell-wrap { position: relative; }
        .notif-bell-btn { position: relative; background: var(--card, #FAF6EE); border: 1px solid var(--card-edge, #E7DECB);
            border-radius: 11px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #6B6149; }
        .notif-bell-btn:hover { background: var(--bg, #EFE9DD); }
        .notif-badge { position: absolute; top: -4px; right: -4px; background: var(--terra, #9A4F38); color: #fff;
            font-size: 10.5px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 999px;
            display: flex; align-items: center; justify-content: center; padding: 0 4px; line-height: 1; }
        .notif-panel { display: none; position: absolute; top: calc(100% + 10px); right: 0; width: 340px;
            max-height: 420px; overflow-y: auto; background: var(--card, #FAF6EE); border: 1px solid var(--card-edge, #E7DECB);
            border-radius: 14px; box-shadow: 0 14px 34px rgba(46,43,38,.16); z-index: 50; text-align: left; }
        .notif-panel.open { display: block; }
        .notif-panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
            border-bottom: 1px solid #ECE3D2; }
        .notif-panel-head span { font-weight: 600; font-size: 14.5px; color: var(--ink, #2E2B26); }
        .notif-panel-head button { background: none; border: none; color: var(--green-soft, #6B8E5A); font-size: 12.5px;
            font-weight: 600; cursor: pointer; padding: 0; }
        .notif-panel-head button:hover { color: var(--green-deep, #3C5A40); }
        .notif-item { display: block; padding: 12px 16px; border-bottom: 1px solid #ECE3D2; text-decoration: none;
            color: inherit; }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: var(--bg, #EFE9DD); }
        .notif-item.unread { background: var(--green-pale, #E6EDDC); }
        .notif-item .notif-msg { font-size: 13.5px; color: var(--ink, #2E2B26); margin: 0 0 3px; line-height: 1.4; }
        .notif-item .notif-time { font-size: 11.5px; color: var(--muted2, #9A917D); }
        .notif-empty { padding: 26px 16px; text-align: center; color: var(--muted, #857C6A); font-size: 13.5px; }
    </style>

    <button type="button" class="notif-bell-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6.5H4c.5-1 2-2.5 2-6.5Z"></path><path d="M10 19.5a2 2 0 0 0 4 0"></path></svg>
        <span class="notif-badge" th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
              th:text="${unreadNotificationCount > 9 ? '9+' : unreadNotificationCount}">3</span>
    </button>

    <div class="notif-panel">
        <div class="notif-panel-head">
            <span>Notifications</span>
            <button type="button" class="notif-mark-all">Mark all read</button>
        </div>
        <div class="notif-list">
            <div class="notif-empty">Loading&hellip;</div>
        </div>
    </div>

    <script th:inline="none">
    (function () {
        var wrap = document.currentScript.closest('.notif-bell-wrap');
        if (!wrap) return;

        var csrfToken = wrap.getAttribute('data-csrf-token');
        var csrfHeader = wrap.getAttribute('data-csrf-header');
        var btn = wrap.querySelector('.notif-bell-btn');
        var panel = wrap.querySelector('.notif-panel');
        var list = wrap.querySelector('.notif-list');
        var badge = wrap.querySelector('.notif-badge');
        var markAllBtn = wrap.querySelector('.notif-mark-all');

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text == null ? '' : text;
            return div.innerHTML;
        }

        function render(notifications) {
            if (!notifications.length) {
                list.innerHTML = '<div class="notif-empty">No notifications yet.</div>';
                return;
            }
            list.innerHTML = notifications.map(function (n) {
                var cls = n.read ? 'notif-item' : 'notif-item unread';
                var href = n.link ? n.link : '#';
                return '<a class="' + cls + '" href="' + escapeHtml(href) + '" data-id="' + n.id + '">' +
                    '<p class="notif-msg">' + escapeHtml(n.message) + '</p>' +
                    '<span class="notif-time">' + escapeHtml(n.createdDisplay) + '</span></a>';
            }).join('');
        }

        function loadNotifications() {
            list.innerHTML = '<div class="notif-empty">Loading&hellip;</div>';
            fetch('/api/notifications', { headers: { 'Accept': 'application/json' } })
                .then(function (res) { return res.json(); })
                .then(render)
                .catch(function () {
                    list.innerHTML = '<div class="notif-empty">Couldn\'t load notifications.</div>';
                });
        }

        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var isOpen = panel.classList.contains('open');
            panel.classList.toggle('open');
            if (!isOpen) {
                loadNotifications();
            }
        });

        document.addEventListener('click', function (e) {
            if (!wrap.contains(e.target)) {
                panel.classList.remove('open');
            }
        });

        list.addEventListener('click', function (e) {
            var item = e.target.closest('.notif-item');
            if (!item) return;
            var id = item.getAttribute('data-id');
            var headers = {};
            headers[csrfHeader] = csrfToken;
            fetch('/api/notifications/' + id + '/read', { method: 'POST', headers: headers });
            // No preventDefault() - the click continues through as a
            // normal link navigation while the mark-as-read call fires
            // alongside it.
        });

        markAllBtn.addEventListener('click', function () {
            var headers = {};
            headers[csrfHeader] = csrfToken;
            fetch('/api/notifications/read-all', { method: 'POST', headers: headers }).then(function () {
                if (badge) badge.remove();
                list.querySelectorAll('.notif-item.unread').forEach(function (el) {
                    el.classList.remove('unread');
                });
            });
        });
    })();
    </script>
</div>

</body>
</html>
