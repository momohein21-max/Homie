<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${member.name} + ' - Homie'">Homie - Member</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Spectral:wght@400;500;600;700&amp;display=swap"
          rel="stylesheet">

    <style>
        :root {
            --bg: #EFE9DD; --card: #FAF6EE; --card-edge: #E7DECB; --ink: #2E2B26;
            --muted: #857C6A; --muted2: #9A917D; --green: #4A7C59;
            --green-deep: #3C5A40; --green-soft: #6B8E5A; --green-pale: #E6EDDC;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body { font-family: 'Hanken Grotesk', sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: #D8CDB6; border-radius: 8px; border: 2px solid #EFE9DD; }
        a { text-decoration: none; }


        .menu-toggle { display: none; }
        .sidebar-backdrop { display: none; }
        .app { display: flex; min-height: 100vh; }

        .sidebar { flex: none; width: 252px; background: var(--green-deep); color: #CCDAC0; display: flex;
                   flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 24px 18px; }
        .sidebar-brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 22px; }
        .sidebar-brand .mark { width: 34px; height: 34px; border-radius: 10px; background: #EAF0E2; color: var(--green-deep);
                                display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
        .sidebar-brand .name { font-family: 'Spectral', serif; font-weight: 600; font-size: 21px; letter-spacing: .04em; color: #F1F5EB; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 13px; width: 100%; padding: 11px 14px; border: none;
                    border-radius: 12px; font-size: 14.5px; cursor: pointer; text-align: left; background: transparent;
                    color: #C2D2B6; font-weight: 500; }
        .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
        .nav-item.active { background: #F4EEE0; color: var(--green-deep); font-weight: 600; }
        .sidebar-footer { border-top: 1px solid rgba(255,255,255,.1); padding-top: 14px; display: flex; align-items: center; gap: 11px; }
        .sidebar-footer-link { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; color: inherit; }
        .sidebar-footer .who-name { font-size: 14px; font-weight: 600; color: #F1F5EB; }
        .sidebar-footer .who-room { font-size: 12px; color: #A9BB9D; }
        .logout-btn { background: rgba(255,255,255,.08); border: none; border-radius: 9px; width: 32px; height: 32px;
                      display: flex; align-items: center; justify-content: center; cursor: pointer; color: #CCDAC0; flex-shrink: 0; }
        .logout-btn:hover { background: rgba(255,255,255,.16); }

        .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .topbar { position: sticky; top: 0; z-index: 5; background: rgba(239,233,221,.86); backdrop-filter: blur(8px);
                  border-bottom: 1px solid #E2D9C8; padding: 18px 36px; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--green-soft); }
        .back-link:hover { color: var(--green-deep); }

        .content { padding: 34px 36px 56px; max-width: 760px; width: 100%; margin: 0 auto; }

        .avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600;
                  color: #FBF8F1; flex-shrink: 0; }
        .avatar-38 { width: 38px; height: 38px; font-size: 14px; }
        .avatar-72 { width: 72px; height: 72px; font-size: 26px; }

        .card { background: var(--card); border: 1px solid var(--card-edge); border-radius: 20px; padding: 30px 32px;
                box-shadow: 0 1px 2px rgba(60,50,30,.04); }
        .member-head { display: flex; align-items: center; gap: 18px; border-bottom: 1px solid #ECE3D2;
                        padding-bottom: 22px; margin-bottom: 22px; }
        .member-name { font-family: 'Spectral', serif; font-size: 26px; color: var(--ink); }
        .member-room { font-size: 14px; color: var(--muted2); margin-top: 3px; }

        .facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 0 0 22px; }
        .fact-card { background: #FFFDF8; border: 1px solid #ECE3D2; border-radius: 12px; padding: 13px 15px; }
        .fact-card .flabel { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--green-soft); }
        .fact-card .fvalue { font-size: 15px; font-weight: 600; color: var(--ink); margin-top: 4px; }

        .detail-row { padding: 14px 0; border-top: 1px solid #ECE3D2; }
        .detail-row:first-child { border-top: none; }
        .detail-label { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--green-soft); }
        .detail-value { font-size: 15px; margin-top: 4px; color: var(--ink); }
        .detail-empty { color: var(--muted); font-style: italic; }

        @media (max-width: 700px) { .sidebar { position: fixed; top: 0; left: 0; height: 100vh; z-index: 60; transform: translateX(-100%); transition: transform .25s ease; box-shadow: 8px 0 24px rgba(0,0,0,.18); }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: flex; align-items: center; justify-content: center; position: fixed; top: 14px; left: 14px; z-index: 70; width: 40px; height: 40px; border-radius: 10px; background: var(--green-deep); color: #EAF0E2; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
            .sidebar-backdrop.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 55; } .facts { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<button class="menu-toggle" onclick="toggleSidebar()" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
    <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>
    <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <a th:href="@{/}" class="sidebar-brand" style="text-decoration:none;cursor:pointer;">
            <div class="mark">H</div>
            <span class="name">HOMIE</span>
        </a>
        <nav class="sidebar-nav">
            <a th:href="@{/}" class="nav-item">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10M9.5 19.5v-5h5v5"></path></svg>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/cleaning}" class="nav-item">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.4c.4 2.7 1.9 4.2 4.6 4.6-2.7.4-4.2 1.9-4.6 4.6-.4-2.7-1.9-4.2-4.6-4.6 2.7-.4 4.2-1.9 4.6-4.6ZM18.5 13.5c.2 1.2.9 1.9 2.1 2.1-1.2.2-1.9.9-2.1 2.1-.2-1.2-.9-1.9-2.1-2.1 1.2-.2 1.9-.9 2.1-2.1Z"></path></svg>
                <span>Cleaning rota</span>
            </a>
            <a th:href="@{/schedule}" class="nav-item">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"></path></svg>
                <span>Washing &amp; bins</span>
            </a>
            <a th:href="@{/bills}" class="nav-item">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21ZM9 8.5h6M9 12.5h6"></path></svg>
                <span>Bills</span>
            </a>
            <a th:href="@{/members}" class="nav-item active">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 20v-1.5a3.5 3.5 0 0 0-3.5-3.5H8a3.5 3.5 0 0 0-3.5 3.5V20M10.5 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M19.5 20v-1.5a3.5 3.5 0 0 0-2.6-3.4M15.5 4.6a3.5 3.5 0 0 1 0 6.8"></path></svg>
                <span>Housemates</span>
            </a>
            <a th:href="@{/announcements}" class="nav-item">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5v3a1 1 0 0 0 1 1h2.5l7 4V5.5l-7 4H5a1 1 0 0 0-1 1ZM18 10a3 3 0 0 1 0 4"></path></svg>
                <span>Announcements</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a th:href="@{/profile}" class="sidebar-footer-link" title="My profile">
                <div class="avatar avatar-38" th:if="${currentUser}"
                     th:style="${@avatarService.pictureUrl(currentUser.name) != null ? ('background-image:url(' + @avatarService.pictureUrl(currentUser.name) + ');background-size:cover;background-position:center;') : ('background:' + @avatarService.color(currentUser.name))}"
                     th:text="${@avatarService.pictureUrl(currentUser.name) != null ? '' : @avatarService.initials(currentUser.name)}">Mo</div>
                <div style="flex:1;min-width:0;">
                    <div class="who-name" th:text="${currentUser != null ? currentUser.name : 'You'}">Momo</div>
                    <div class="who-room" th:text="${currentUser != null and currentUser.room != null ? currentUser.room : 'No room set'}">Room 4</div>
                </div>
            </a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="logout-btn" title="Sign out">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
                </button>
            </form>
        </div>
    </aside>

    <!-- Main -->
    <main class="main">
        <header class="topbar">
            <a th:href="@{/members}" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
                All housemates
            </a>
        </header>

        <div class="content">
            <div class="card">
                <div class="member-head">
                    <div class="avatar avatar-72" th:style="${@avatarService.pictureUrl(member.name) != null ? ('background-image:url(' + @avatarService.pictureUrl(member.name) + ');background-size:cover;background-position:center;') : ('background:' + @avatarService.color(member.name))}"
                         th:text="${@avatarService.pictureUrl(member.name) != null ? '' : @avatarService.initials(member.name)}">Mo</div>
                    <div>
                        <div class="member-name" th:text="${member.name}">Momo</div>
                        <div class="member-room" th:text="${member.room} ?: 'No room set'">Room 4</div>
                    </div>
                </div>

                <div class="facts">
                    <div class="fact-card">
                        <div class="flabel">Bins &amp; washing</div>
                        <div class="fvalue" th:text="${@scheduleService.weekdayForRoom(member.room)}">Wednesday</div>
                    </div>
                    <div class="fact-card">
                        <div class="flabel">Next clean</div>
                        <div class="fvalue" th:text="${@scheduleService.cleaningLabelFor(member.name, today)}">This week</div>
                    </div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">Responsibility</div>
                    <div class="detail-value" th:if="${member.duty != null and !#strings.isEmpty(member.duty)}"
                         th:text="${member.duty}">Wifi router admin</div>
                    <div class="detail-value detail-empty"
                         th:if="${member.duty == null or #strings.isEmpty(member.duty)}">No responsibility set yet.</div>
                </div>

                <div class="detail-row">
                    <div class="detail-label">Payment details</div>
                    <div class="detail-value" th:if="${member.paymentDetails != null and !#strings.isEmpty(member.paymentDetails)}"
                         th:text="${member.paymentDetails}">IBAN or Revolut handle</div>
                    <div class="detail-value detail-empty"
                         th:if="${member.paymentDetails == null or #strings.isEmpty(member.paymentDetails)}">Not shared yet.</div>
                </div>
            </div>
        </div>
    </main>
</div>
<script>
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.querySelector('.sidebar-backdrop').classList.toggle('show');
}
</script>
</body>
</html>
