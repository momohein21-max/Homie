spring.application.name=app

# --- Database connection ---
# Homie's database is hosted on Supabase Postgres (Render's own free-tier
# Postgres expired and was deleted - see the README for that story), using
# the Session Pooler connection string from Supabase's "Connect" page,
# since Render's servers are IPv4-only and Supabase's direct connection is
# IPv6-only.
#
# SECURITY NOTE: unlike earlier versions of this file, there is
# deliberately NO real password (or even a fake-but-real-shaped one)
# committed here. This file is going into a GitHub repo, and a database
# password sitting in a public (or even private-but-shared) repo is a
# leaked credential the moment it's pushed. Every value below is read
# from an environment variable with either no default or an obviously
# fake placeholder default, so the app fails loudly if you forget to set
# them on Render rather than silently reusing a stale or exposed value.
# Set the real values in Render's dashboard under your Web Service's
# Environment tab - see the README for the exact steps.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:CHANGE_ME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.thymeleaf.cache=false

# --- Email (for "forgot password" reset links) ---
# Uses Gmail's own SMTP server to send mail, through the same Gmail
# account you already use (momohein21@gmail.com). Gmail requires an "App
# Password" for this rather than your normal Gmail password - a 16
# character code you generate once. Steps:
#   1. Go to myaccount.google.com/security
#   2. Turn on 2-Step Verification if it isn't already on (Gmail requires
#      this before it will let you create an App Password)
#   3. Search that same page for "App passwords" (or go directly to
#      myaccount.google.com/apppasswords)
#   4. Create one, name it something like "Homie", and copy the 16
#      character code it gives you (spaces don't matter)
#   5. Paste that code below as MAIL_APP_PASSWORD (replacing the
#      placeholder), with the spaces removed
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:momohein21@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Translation (Announcements/Bills "Translate" button) ---
# Talks to a locally-run Ollama model to translate housemate-written text
# on demand - see TranslationService for the full explanation, including
# an important note about why this needs extra setup once the app is
# actually deployed (Ollama has to be reachable from wherever Homie runs,
# not just from your own laptop).
#   OLLAMA_BASE_URL - where Ollama's API is listening. Defaults to
#     Ollama's own default local address, which is correct for running
#     Homie and Ollama on the same machine.
#   OLLAMA_MODEL - which pulled-locally model to ask for translations.
#     Defaults to llama3.2 - pull it once with "ollama pull llama3.2",
#     or set this to whichever model you've already pulled.
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2}

# The web address reset-password links should point at. Change this to
# your real onrender.com address once your Web Service is live - until
# then, links in reset emails will point at your local machine, which is
# fine for testing locally but won't work for anyone else.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Render assigns a random port to your app and tells it which one via the
# PORT environment variable - it does NOT use 8080. This line means: "use
# whatever PORT Render gives you; if there's no such variable (i.e. we're
# running locally), fall back to 8080 like before."
server.port=${PORT:10000}
server.forward-headers-strategy=framework

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=10MB
