spring.application.name=app

# --- Database connection ---
# Points at your real homie-db Postgres database on Render (Frankfurt
# region), using the values from its "Connections" page:
#   Database: homie_db_72f6
#   Username: homie_admin
#   Port:     5432
#
# The hostname below (dpg-d94p9g7lk1mc73boj0c0-a.frankfurt-postgres.render.com)
# is built from Render's standard pattern: your internal hostname
# (dpg-d94p9g7lk1mc73boj0c0-a) plus ".frankfurt-postgres.render.com" for
# databases in the Frankfurt region. If the app can't connect, this is
# the one value worth double-checking - copy the "External Database URL"
# from Render's Connections page, and the part between "@" and the next
# "/" is your real external hostname. Replace it below if it differs.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-d94p9g7lk1mc73boj0c0-a.frankfurt-postgres.render.com:5432/homie_db_72f6?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:homie_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:E5V59eTwcbNzW7ZWVYPL3or2roAJvW2Y}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.thymeleaf.cache=false

# --- Email (for "forgot password" reset links) ---
# Uses Gmail's own SMTP server to send mail, through the same Gmail
# account you already use (momohein21@gmail.com). Gmail requires an "App
# Password" for this rather than your normal Gmail password - a 16
# character code you generate once. Steps:
#   1. Go to myaccount.google.com/security
#   2. Turn on 2-Step Verification if it isn't already on (Gmail requires
#      this before it will let you create an App Password)
#   3. Search that same page for "App passwords" (or go directly to
#      myaccount.google.com/apppasswords)
#   4. Create one, name it something like "Homie", and copy the 16
#      character code it gives you (spaces don't matter)
#   5. Paste that code below as MAIL_APP_PASSWORD (replacing the
#      placeholder), with the spaces removed
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:momohein21@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# The web address reset-password links should point at. Change this to
# your real onrender.com address once your Web Service is live - until
# then, links in reset emails will point at your local machine, which is
# fine for testing locally but won't work for anyone else.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Render assigns a random port to your app and tells it which one via the
# PORT environment variable - it does NOT use 8080. This line means: "use
# whatever PORT Render gives you; if there's no such variable (i.e. we're
# running locally), fall back to 8080 like before."
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=10MB
